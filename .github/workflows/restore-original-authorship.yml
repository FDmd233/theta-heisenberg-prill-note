name: Restore original Theta authorship

on:
  push:
    paths:
      - '.github/workflows/restore-original-authorship.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source authorship
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('theta_heisenberg_prill_note.tex')
          s=p.read_text(encoding='utf-8')
          s=s.replace('\\author{Zhijie He}', '\\author{OpenAI}')
          s=s.replace('pdfauthor={Zhijie He}', 'pdfauthor={OpenAI}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: theta_heisenberg_prill_note.tex
          texlive_version: 2026
      - name: Verify and checksum
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p /tmp/theta-qa
          pdfinfo theta_heisenberg_prill_note.pdf | grep -F 'Author:          OpenAI'
          pdftoppm -f 1 -singlefile -png -r 160 theta_heisenberg_prill_note.pdf /tmp/theta-qa/page >/dev/null 2>&1
          sha256sum theta_heisenberg_prill_note.pdf theta_heisenberg_prill_note.tex c5_degree5_certificate.g c5_degree5_character_check.py a5_genus2_mcg_boundary_certificate.g > SHA256SUMS
      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: theta-authorship-qa
          path: /tmp/theta-qa/page.png
      - name: Refresh release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for a in theta_heisenberg_prill_note.pdf theta_heisenberg_prill_note.tex SHA256SUMS; do
            gh release delete-asset v1.0.0 "$a" -y || true
          done
          gh release upload v1.0.0 theta_heisenberg_prill_note.pdf theta_heisenberg_prill_note.tex SHA256SUMS --clobber
      - name: Commit restoration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-original-authorship.yml
          git add theta_heisenberg_prill_note.tex theta_heisenberg_prill_note.pdf SHA256SUMS
          git commit -m 'Restore original Theta authorship'
          git pull --rebase origin main
          git push
