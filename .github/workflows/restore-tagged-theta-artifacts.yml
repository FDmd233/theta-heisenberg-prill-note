name: Restore tagged Theta artifacts

on:
  push:
    paths:
      - '.github/workflows/restore-tagged-theta-artifacts.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore PDF and checksum from tagged snapshot
        shell: bash
        run: |
          git show 'v1.0.0:theta_heisenberg_prill_note.pdf' > theta_heisenberg_prill_note.pdf
          git show 'v1.0.0:SHA256SUMS' > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Restore release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete-asset v1.0.0 theta_heisenberg_prill_note.pdf -y
          gh release delete-asset v1.0.0 SHA256SUMS -y
          gh release upload v1.0.0 theta_heisenberg_prill_note.pdf SHA256SUMS --clobber

      - name: Commit tagged artifacts and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/restore-tagged-theta-artifacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Theta tagged artifacts'
          git push
