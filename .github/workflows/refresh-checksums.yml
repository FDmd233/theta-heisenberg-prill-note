name: Refresh current checksums

on:
  push:
    paths:
      - '.github/workflows/refresh-checksums.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute current-file checksums
        run: |
          sha256sum \
            theta_heisenberg_prill_note.pdf \
            theta_heisenberg_prill_note.tex \
            c5_degree5_certificate.g \
            c5_degree5_character_check.py \
            a5_genus2_mcg_boundary_certificate.g > SHA256SUMS
      - name: Commit checksum update and remove temporary workflow
        run: |
          rm -f .github/workflows/refresh-checksums.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh current artifact checksums'
          git push
