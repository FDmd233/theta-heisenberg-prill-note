name: Update repository description

on:
  push:
    paths:
      - '.github/workflows/update-repository-description.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description='A genus-two Prill minimum note using theta groups and Heisenberg representations.'
